    //显示最新一条火警详情信息
    function  showFirstFireInfo(){
     $.ajax({
        type: "get",
        url: loginUrl + sessionStorage.myToken,
           data: {
            page: 1, //请求页数
            rows: 50, //每页行数
            sort: 'PutStorageTime', //  排序字段
            order: 'desc',
            hour: 1,
            startTime: "",
            endTime: "",
            satellite: "ALL",
            sky: "ALL",
            ground: "ALL",
            landtype: "ALL",
            isbuffer: false,
            Country:"中国",

        },
        dataType: "jsonp",    //跨域json请求一定是jsonp
        success: function (data, status) {
            if (data.rows.length > 0) {
                flyTo(data.rows[0].Longitude, data.rows[0].Latitude);
                //SelectMarker(map, sourceMarker, data.rows[0].Id, null, null, data.rows[0].Longitude,data.rows[0].Latitude, null, null, null);
             CircleMarker(map, sourceMarker, data.rows[0].Longitude, data.rows[0].Latitude, 0.012, '#4271AE');

                Marker(map, sourceMarker, data.rows[0].Id, data.rows[0].FormattedAddress, data.rows[0].FormattedAddress, data.rows[0].Longitude, data.rows[0].Latitude, '#4271AE', 'images/red.png', 0.4);

                buildPopupString(data,data.rows[0].Id);
                $("#fire-info").animate({ bottom: '0px' }, 500);
            }
        },
        error: function (e) {
             reLogin();
        },
        complete: function () {
        }
    });
       // hideAllWindow();

    }

    //火点详情和火点列表下滑隐藏
         var startY, endY,listStartY,listEndY;
        document.getElementById("fire-info").addEventListener("touchstart", touchStart, false);
        document.getElementById("fire-info").addEventListener("touchmove", touchMove, false);
        document.getElementById("fire-info").addEventListener("touchend", touchEnd, false);
        document.getElementById("fireListHeader").addEventListener("touchstart", touchListStart, false);
        document.getElementById("fireListHeader").addEventListener("touchmove", touchListMove, false);
        document.getElementById("fireListHeader").addEventListener("touchend", touchListEnd, false);

            function touchStart(event) {
                var touch = event.touches[0];
                startY = touch.pageY;
            }
            function touchMove(event) {
                var touch = event.touches[0];
                endY = startY - touch.pageY;
            }
            function touchEnd(event) {
                //100是给定触上下方向摸起始的坐标差
                if (endY <-100) {//下滑超过100
                    if ($("#fire-info").css('bottom') != '-1000px') {
                         $("#fire-info").animate({ bottom: '-1000px' }, 500);
                        }
                }
                endY = 0;
            }
             function touchListStart(event) {
                var touch = event.touches[0];
                listStartY = touch.pageY;
            }
            function touchListMove(event) {
                var touch = event.touches[0];
                listEndY = listStartY - touch.pageY;
            }
            function touchListEnd(event) {
                //100是给定触上下方向摸起始的坐标差
                if (listEndY <-100) {//下滑超过100
                    if ($("#info-list").css('top') != '1000px') {
                        $("#info-list").animate({ top: '1000px' }, 500);
                    }
                }
                listEndY = 0;
            }
