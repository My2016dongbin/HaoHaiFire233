    /*    compile 'com.squareup.okhttp3:okhttp:3.14.2'
    compile 'com.squareup.okio:okio:1.17.4'*/
    compile 'cn.jiguang.sdk:jpush:3.3.4'
    compile 'cn.jiguang.sdk:jcore:2.1.2'
    compile 'com.android.support:appcompat-v7:25.0.1'
    compile 'com.squareup.okhttp3:okhttp-urlconnection:3.2.0'
    compile 'com.google.code.gson:gson:2.7'
    compile 'com.android.support:support-v4:26.0.0-alpha1'
    compile 'com.github.vilyever:AndroidSocketClient:3.0.3'
    compile 'com.google.protobuf:protobuf-java:3.1.0'
    compile 'com.google.protobuf:protoc:3.1.0'
    compile 'de.hdodenhof:circleimageview:2.2.0'
    compile 'com.android.support:design:23.4.0'
    compile 'com.blankj:utilcode:1.16.0'
    compile 'com.zhy:okhttputils:2.6.2'
